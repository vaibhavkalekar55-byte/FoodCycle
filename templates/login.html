{% extends "base.html" %}
{% block title %}Login — FoodCycle{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <span class="eyebrow">Welcome back</span>
    <h1>Enter the cycle.</h1>
    <p>Continue making a difference.</p>
    <form method="POST">
      <label>Email<input type="email" name="email" required placeholder="you@example.com"></label>
      <label>Password<input type="password" name="password" required placeholder="••••••••"></label>
      <button class="btn primary full" type="submit">Login →</button>
    </form>
    <p class="auth-bottom">New to FoodCycle? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
